server:
  port: 8080
  debug: true

database:
  host: localhost
  port: 5432
  user: postgres
  password: postgres
  dbname: courses
  sslmode: disable

auth:
  jwks_url: https://your-tenant.auth0.com/.well-known/jwks.json
  audience: your-api-audience
  issuer: https://your-tenant.auth0.com/

management:
  endpoints:
    web:
      exposure:
        include: health, info
