services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: sdlp-postgres
    environment:
      POSTGRES_DB: courses
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Go API Server
  server:
    build:
      context: ./services/go-course-service
      dockerfile: Dockerfile
    container_name: sdlp-server
    ports:
      - "8080:8080"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: courses
      DB_SSLMODE: disable
      DISABLE_AUTH: "true"
      AUTH_JWKS_URL: ${AUTH0_JWKS_URL:-https://dev-placeholder.auth0.com/.well-known/jwks.json}
      AUTH_AUDIENCE: ${AUTH0_AUDIENCE:-https://localhost:8080}
      AUTH_ISSUER: ${AUTH0_ISSUER_URI:-https://dev-placeholder.auth0.com/}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # Next.js Client
  client:
    build:
      context: ./client
      dockerfile: Dockerfile.dev
    container_name: sdlp-client
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8080
      DISABLE_AUTH: "true"
      AUTH0_SECRET: ${AUTH0_SECRET:-development-secret-change-me}
      AUTH0_BASE_URL: ${AUTH0_BASE_URL:-http://localhost:3000}
      AUTH0_ISSUER_BASE_URL: ${AUTH0_ISSUER_URI:-https://dev-placeholder.auth0.com/}
      AUTH0_CLIENT_ID: ${AUTH0_CLIENT_ID:-dev-client-id}
      AUTH0_CLIENT_SECRET: ${AUTH0_CLIENT_SECRET:-dev-client-secret}
    volumes:
      - ./client:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - server
    restart: unless-stopped

volumes:
  postgres_data:
