name: Agent Sandbox

on:
  workflow_dispatch:
    inputs:
      subfolder:
        description: 'Subfolder to work on (typescript-service, python-service, go-service, or all)'
        required: true
        type: string
      issue_number:
        description: 'Issue or PR number'
        required: true
        type: string

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

jobs:
  run-sandbox:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Create feature branch
        id: create-branch
        run: |
          BRANCH_NAME="agent/issue-${{ inputs.issue_number }}"
          git checkout -b $BRANCH_NAME
          echo "branch_name=$BRANCH_NAME" >> $GITHUB_OUTPUT

      - name: Run OpenCode
        uses: anomalyco/opencode/github@latest
        with:
          model: opencode/hy3-preview-free
          prompt: |
            Issue #${{ inputs.issue_number }}

            Please work on the task in services/${{ inputs.subfolder }} following TDD principles.
            Read the issue for full requirements.

      - name: Commit and push changes
        if: success()
        run: |
          git config user.name "opencode[bot]"
          git config user.email "opencode[bot]@users.noreply.github.com"
          git add .
          git commit -m "feat: implement changes for issue #${{ inputs.issue_number }}" || echo "No changes to commit"
          git push -u origin ${{ steps.create-branch.outputs.branch_name }} || echo "No changes to push"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Pull Request
        if: success()
        run: |
          gh pr create \
            --title "Agent: Issue #${{ inputs.issue_number }}" \
            --body "Automated PR generated by OpenCode workflow for Issue #${{ inputs.issue_number }}" \
            --head ${{ steps.create-branch.outputs.branch_name }} \
            --label "agent-pr" \
            --draft
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Comment on issue/PR
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const issueNumber = parseInt('${{ inputs.issue_number }}');
            const jobStatus = '${{ job.status }}';
            let body = '';
            if (jobStatus === 'success') {
              body = `✅ **OpenCode workflow completed successfully!**\n\nPR created: [View Pull Request](#). The agent has completed the task following TDD principles.`;
            } else {
              body = `❌ **OpenCode workflow failed.**\n\nCheck the [workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) for details.`;
            }
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body: body
            });
