name: Agent Sandbox

on:
  workflow_dispatch:
    inputs:
      subfolder:
        description: 'Subfolder to work on (typescript-service, python-service, go-service, or all)'
        required: true
        type: string
      issue_number:
        description: 'Issue or PR number'
        required: true
        type: string

jobs:
  run-sandbox:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Docker sbx CLI
        run: |
          curl -fsSL https://get.docker.com | sudo REPO_ONLY=1 sh
          sudo apt-get update
          sudo apt-get install -y docker-sbx

      - name: Configure sbx secrets
        run: |
          # Set up secrets for agent authentication
          if [ -n "${{ secrets.ANTHROPIC_API_KEY }}" ]; then
            sbx secret set -g anthropic -t "${{ secrets.ANTHROPIC_API_KEY }}"
          fi
          if [ -n "${{ secrets.GITHUB_TOKEN }}" ]; then
            sbx secret set -g github -t "${{ secrets.GITHUB_TOKEN }}"
          fi

      - name: Create feature branch
        id: create-branch
        run: |
          BRANCH_NAME="agent/issue-${{ inputs.issue_number }}"
          git checkout -b $BRANCH_NAME
          echo "branch_name=$BRANCH_NAME" >> $GITHUB_OUTPUT

      - name: Run Docker Sandbox with Agent
        run: |
          # Determine agent (default to opencode as per specification)
          AGENT="opencode"
          
          # Run sbx in branch mode with workspace set to current directory
          sbx run $AGENT \
            --branch ${{ steps.create-branch.outputs.branch_name }} \
            --workspace . \
            --name "agent-issue-${{ inputs.issue_number }}"
          
          # Note: sbx run blocks until the agent completes its work

      - name: Upload agent artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-artifacts-${{ inputs.issue_number }}
          path: |
            **/thought_process.log
            **/test_results.json
          if-no-files-found: warn

      - name: Push branch and create PR
        if: success()
        run: |
          git push -u origin ${{ steps.create-branch.outputs.branch_name }}
          gh pr create \
            --title "Agent: Issue #${{ inputs.issue_number }}" \
            --body "Automated PR generated by AI Agent workflow" \
            --label "agent-pr" \
            --draft
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Comment on issue/PR
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const issueNumber = parseInt('${{ inputs.issue_number }}');
            const jobStatus = '${{ job.status }}';
            let body = '';
            
            if (jobStatus === 'success') {
              body = `✅ **Agent workflow completed successfully!**\n\nPR created: [View Pull Request](#). The agent has completed the task following TDD principles.`;
            } else {
              body = `❌ **Agent workflow failed.**\n\nCheck the [workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) and uploaded artifacts for details.`;
            }
            
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body: body
            });
