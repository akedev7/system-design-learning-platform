name: Agent Sandbox

on:
  workflow_dispatch:
    inputs:

      issue_number:
        description: 'Issue or PR number'
        required: true
        type: string

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

jobs:
  run-sandbox:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.PAT_TOKEN }}

      - name: Configure git identity
        run: |
          git config user.name "opencode[bot]"
          git config user.email "opencode[bot]@users.noreply.github.com"

      - name: Create feature branch
        id: create-branch
        run: |
          BRANCH_NAME="agent/issue-${{ inputs.issue_number }}"
          git checkout -b $BRANCH_NAME
          echo "branch_name=$BRANCH_NAME" >> $GITHUB_OUTPUT

      - name: Run OpenCode
        uses: anomalyco/opencode/github@latest
        env:
          GITHUB_TOKEN: ${{ secrets.PAT_TOKEN }}
        with:
          model: opencode/hy3-preview-free
          use_github_token: true
          prompt: |
            Issue #${{ inputs.issue_number }}

            Please use the tdd skill to work on the task specified in Issue #${{ inputs.issue_number }}.
            Read the issue for full requirements.

            When complete:
            1. Commit all changes to the current branch with a meaningful message.
            2. Create a PR from this branch to main with title "Agent: Issue #${{ inputs.issue_number }}", body "Automated PR for Issue #${{ inputs.issue_number }}", label "agent-pr", and mark as Draft initially.
            3. Comment on issue #${{ inputs.issue_number }} to confirm completion.

      - name: Comment on issue/PR
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const issueNumber = parseInt('${{ inputs.issue_number }}');
            const jobStatus = '${{ job.status }}';
            let body = '';
            if (jobStatus === 'success') {
              body = `✅ **OpenCode workflow completed successfully!**\n\nPR created: [View Pull Request](#). The agent has completed the task following TDD principles.`;
            } else {
              body = `❌ **OpenCode workflow failed.**\n\nCheck the [workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) for details.`;
            }
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body: body
            });
