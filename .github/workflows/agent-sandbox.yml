name: Agent Sandbox

on:
  workflow_dispatch:
    inputs:
      subfolder:
        description: 'Subfolder to work on'
        required: true
        type: string
      issue_number:
        description: 'Issue number'
        required: true
        type: string

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

jobs:
  run-sandbox:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install opencode
        run: curl -fsSL https://opencode.ai/install | bash

      - name: Add opencode to PATH
        run: echo "$HOME/.opencode/bin" >> $GITHUB_PATH

      - name: Create feature branch
        id: create-branch
        run: |
          BRANCH_NAME="agent/issue-${{ inputs.issue_number }}"
          git checkout -b $BRANCH_NAME
          echo "branch_name=$BRANCH_NAME" >> $GITHUB_OUTPUT

      - name: Run OpenCode Agent
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          opencode --model anthropic/claude-sonnet-4-20250514 --prompt "Implement the feature for issue #${{ inputs.issue_number }}" || true
