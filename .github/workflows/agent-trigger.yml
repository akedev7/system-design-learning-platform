name: Agent Trigger

on:
  issues:
    types: [labeled]
  pull_request:
    types: [labeled]

permissions:
  actions: write
  contents: write
  issues: write
  pull-requests: write

jobs:
  check-label:
    if: contains(github.event.label.name, 'agent-take')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Trigger sandbox workflow
        uses: actions/github-script@v7
        with:
          script: |
            const defaultBranch = '${{ github.event.repository.default_branch || 'main' }}';
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'agent-sandbox.yml',
              ref: defaultBranch,
              inputs: {
                issue_number: '${{ github.event.issue.number || github.event.pull_request.number }}'
              }
            });

      - name: Comment on issue/PR
        uses: actions/github-script@v7
        with:
          script: |
            const issueNumber = ${{ github.event.issue.number || github.event.pull_request.number }};
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body: '🤖 AI Agent triggered! The sandbox workflow has been initiated. I will start working on this task shortly.'
            });
