name: Backend CI

on:
  pull_request:
    paths:
      - 'services/spring-boot-service/**'

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/spring-boot-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
      - run: mvn test -B
      - name: Build Docker image
        run: mvn spring-boot:build-image -B
