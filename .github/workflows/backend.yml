name: Backend CI

on:
  pull_request:
    paths:
      - 'services/go-course-service/**'

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/go-course-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true
      - run: make setup
      - run: make test
      - run: make lint
      - name: Build Docker image
        run: docker build -t go-course-service .
